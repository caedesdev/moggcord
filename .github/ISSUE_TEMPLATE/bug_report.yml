name: Bug report
description: Report a reproducible problem with Moggcord, its installer or the community connector.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Moggcord. Check the [troubleshooting guide](https://github.com/caedesdev/moggcord/blob/main/docs/troubleshooting/README.md) and search existing issues first.
        Never include account tokens, cookies, private messages or unreviewed settings exports.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installer or repair
        - Client or settings
        - Plugin
        - Theme or QuickCSS
        - Updates
        - Community connector
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64, macOS Apple Silicon, Ubuntu 24.04 x64…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Moggcord version and installation method
      description: Use the version shown in settings or the installer. Write unknown if you cannot open it.
      placeholder: Version…, published installer / local build / community connector
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Discord channel
      options:
        - Stable
        - Canary
        - PTB
        - Not applicable or unknown
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
      description: Include the affected plugin or theme if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant errors, screenshots and recovery attempts
      description: Share a small, redacted log excerpt. Mention whether a restart, Repair or disabling the affected plugin changed the result.
    validations:
      required: false
