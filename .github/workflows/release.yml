name: Build & Release Moggcord

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after all three platform builds pass
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm buildStandalone

      - name: Test plugin bundle
        run: |
          pnpm test:plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:community

      - name: Package Moggcord dist
        shell: pwsh
        run: |
          node scripts/build/collect-assets.mjs
          Remove-Item "dist\desktop\*.map","dist\desktop\*.LEGAL.txt" -Force -ErrorAction SilentlyContinue
          node scripts/build/verify-dist.mjs
          node scripts/build/verify-release.mjs

      - name: Package community plugin compiler
        run: node scripts/build/community-compiler.mjs

      - name: Build installer
        shell: pwsh
        run: .\scripts\build\windows-installer.ps1

      - name: Test installer
        run: |
          pnpm test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/tests/installer-native --configuration Release

      - name: Create version metadata
        id: metadata
        shell: pwsh
        run: |
          node scripts/build/catalog-stats.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = Get-Content "dist\plugin-catalog.json" -Raw | ConvertFrom-Json
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = if ("${{ github.ref }}".StartsWith('refs/tags/')) { "${{ github.ref_name }}" -replace '^v','' } else { $pkgVersion }
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "package.json version ($pkgVersion) must match tag (v$tagVersion). Bump package.json before releasing."
            exit 1
          }
          $version = $pkgVersion
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $meta = [ordered]@{
            version = $version
            pluginCatalog = $catalog
            releaseDate = (Get-Date -Format "yyyy-MM-dd")
            installerUrl = "https://github.com/caedesdev/moggcord/releases/latest/download/Moggcord-Installer.exe"
            distUrl = "https://github.com/caedesdev/moggcord/releases/download/updates-v$version/moggcord-dist.zip"
            updateUrl = "https://github.com/caedesdev/moggcord/releases/download/updates-v$version/moggcord-update.zip"
            downloadUrl = "https://github.com/caedesdev/moggcord/releases/download/updates-v$version/desktop.asar"
            moggcordAsarUrl = "https://github.com/caedesdev/moggcord/releases/download/updates-v$version/moggcord.asar"
            changelog = "Moggcord $version"
          }
          $meta | ConvertTo-Json -Depth 5 | Set-Content "release\installer\version.json"

      - name: Validate release assets
        run: node scripts/build/validate-release.mjs
        env:
          MOGGCORD_RELEASE_TAG: v${{ steps.metadata.outputs.version }}

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @("release\installer\Moggcord-Installer.exe", "release\installer\moggcord-dist.zip", "release\installer\moggcord-community-compiler.tar.gz", "release\installer\version.json", "dist\desktop.asar", "dist\moggcord.asar", "release\installer\installer-verification.json")
          $lines = foreach ($file in $files) {
            $fingerprint = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$fingerprint  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath "release\installer\SHA256SUMS.txt" -Encoding ascii

      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/release-assets -Force | Out-Null
          Copy-Item release/installer/Moggcord-Installer.exe,release/installer/moggcord-dist.zip,release/installer/moggcord-community-compiler.tar.gz,release/installer/version.json,dist/desktop.asar,dist/moggcord.asar,release/installer/installer-verification.json -Destination release/release-assets
          node scripts/build/update-archive.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/release-assets/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm buildStandalone
      - run: pnpm build:platform-installer
      - name: Test native patching and restoration
        shell: bash
        run: |
          MOGGCORD_NATIVE_INSTALLER="$PWD/.codex-temp/platform-installer/${{ matrix.platform }}/resources/equilotl" pnpm test:platform-installer
          pnpm test:installer
          node --test scripts/tests/community.test.mjs scripts/tests/updater.test.mjs scripts/tests/update-download.test.mjs scripts/tests/release.test.mjs
      - name: Package native installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --projectDir "$PWD/.codex-temp/platform-installer/${{ matrix.platform }}" --config "$PWD/installer-desktop/electron-builder.cjs" --publish never
      - name: Verify packaged Linux installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          xvfb-run -a node scripts/build/verify-platform-package.mjs
          test -s release/platform-installers/Moggcord-Installer-Linux.AppImage
          test -s release/platform-installers/Moggcord-Installer-Linux.deb
      - name: Verify packaged macOS installer
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          node scripts/build/verify-platform-package.mjs
          codesign --verify --deep --strict "release/platform-installers/mac-universal/Moggcord Installer.app"
          hdiutil verify release/platform-installers/Moggcord-Installer-macOS.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/platform-installers/*.dmg
            release/platform-installers/*.AppImage
            release/platform-installers/*.deb
            release/platform-installers/installer-verification-*.json
          if-no-files-found: error

  compiler-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: compiler-assets
      - name: Build with the Windows compiler artifact
        run: node scripts/tests/community-compiler-smoke.mjs --archive compiler-assets/moggcord-community-compiler.tar.gz

  publish:
    needs: [build, desktop, compiler-smoke]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create release checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
      - name: Separate installers from technical update files
        run: node scripts/build/release-layout.mjs
      - name: Publish technical update files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updates-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Moggcord update files ${{ needs.build.outputs.version }}
          prerelease: true
          make_latest: "false"
          body: |
            Technical files for Moggcord ${{ needs.build.outputs.version }}.
            For normal installation, use the [desktop installers](https://github.com/caedesdev/moggcord/releases/tag/v${{ needs.build.outputs.version }}).
            These assets are used by the updater and website. SHA256SUMS.txt also covers the installer packages.
          files: release-assets/updates/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Moggcord ${{ needs.build.outputs.version }}
          make_latest: "true"
          body_path: docs/releases/${{ needs.build.outputs.version }}.md
          files: release-assets/installers/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
