name: Build & Release Moggcord

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm buildStandalone

      - name: Test plugin bundle
        run: pnpm test:plugins

      - name: Package Moggcord dist
        shell: pwsh
        run: |
          node scripts/build/collect-assets.mjs
          Remove-Item "dist\desktop\*.map","dist\desktop\*.LEGAL.txt" -Force -ErrorAction SilentlyContinue
          node scripts/build/verify-dist.mjs
          node scripts/build/verify-release.mjs

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Test installer
        run: |
          pnpm test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/tests/installer-native --configuration Release

      - name: Create version metadata
        shell: pwsh
        run: |
          node scripts/build/catalog-stats.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = Get-Content "dist\plugin-catalog.json" -Raw | ConvertFrom-Json
          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
            Write-Error "package.json version ($pkgVersion) must match tag (v$tagVersion). Bump package.json before releasing."
            exit 1
          }
          $version = $pkgVersion
          $meta = [ordered]@{
            version = $version
            pluginCatalog = $catalog
            releaseDate = (Get-Date -Format "yyyy-MM-dd")
            installerUrl = "https://github.com/caedesdev/moggcord/releases/latest/download/Moggcord-Installer.exe"
            distUrl = "https://github.com/caedesdev/moggcord/releases/latest/download/moggcord-dist.zip"
            downloadUrl = "https://github.com/caedesdev/moggcord/releases/latest/download/desktop.asar"
            moggcordAsarUrl = "https://github.com/caedesdev/moggcord/releases/latest/download/moggcord.asar"
            changelog = "Moggcord $version"
          }
          $meta | ConvertTo-Json -Depth 5 | Set-Content "release\installer\version.json"

      - name: Validate release assets
        run: node scripts/build/validate-release.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = @("release\installer\Moggcord-Installer.exe", "release\installer\moggcord-dist.zip", "release\installer\version.json", "dist\desktop.asar", "dist\moggcord.asar", "release\installer\installer-verification.json")
          $lines = foreach ($file in $files) {
            $fingerprint = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$fingerprint  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath "release\installer\SHA256SUMS.txt" -Encoding ascii

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer/Moggcord-Installer.exe
            release/installer/moggcord-dist.zip
            release/installer/version.json
            dist/desktop.asar
            dist/moggcord.asar
            release/installer/SHA256SUMS.txt
            release/installer/installer-verification.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
